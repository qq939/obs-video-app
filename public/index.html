<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>OBS 视频流</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="viewport" class="viewport">
        <!-- Three pages horizontally arranged (translateX). All share the same vertical video feed -->
        <div id="pages" class="pages">

            <!-- Page 0: main feed + right playback info panel -->
            <section class="page" data-page="0">
                <div class="feed" data-feed="0">
                    <div class="empty-state"><div class="empty-icon">🎬</div><p>还没有视频</p><p class="sub">右滑到设置页点击 + 上传</p></div>
                </div>
                <aside class="side-panel info-panel" id="infoPanel">
                    <div class="panel-head">播放信息</div>
                    <div class="panel-body">
                        <div class="info-row"><span>文件名</span><b id="infoName">-</b></div>
                        <div class="info-row"><span>大小</span><b id="infoSize">-</b></div>
                        <div class="info-row"><span>时间</span><b id="infoTime">-</b></div>
                        <div class="info-row"><span>进度</span><b id="infoProgress">0%</b></div>
                        <div class="info-row"><span>索引</span><b id="infoIndex">-</b></div>
                    </div>
                </aside>
            </section>

            <!-- Page 1: main feed (default) -->
            <section class="page" data-page="1">
                <div class="feed" data-feed="1">
                    <div class="empty-state"><div class="empty-icon">🎬</div><p>还没有视频</p><p class="sub">右滑到设置页点击 + 上传</p></div>
                </div>
                <div class="page-dot" id="pageDot"></div>
            </section>

            <!-- Page 2: main feed + right settings menu + upload button -->
            <section class="page" data-page="2">
                <div class="feed" data-feed="2">
                    <div class="empty-state"><div class="empty-icon">🎬</div><p>还没有视频</p><p class="sub">点击右下角 + 上传视频</p></div>
                </div>
                <aside class="side-panel settings-panel" id="settingsPanel">
                    <div class="panel-head">设置</div>
                    <div class="panel-body">
                        <div class="setting-row"><span>视频数量</span><b id="videoCount">0</b></div>
                        <div class="setting-row"><span>随机播放</span><label class="switch"><input type="checkbox" id="randomSwitch" checked><i></i></label></div>
                        <div class="setting-row"><span>自动播放</span><label class="switch"><input type="checkbox" id="autoplaySwitch" checked><i></i></label></div>
                        <button class="upload-panel-btn" id="uploadPanelBtn">＋ 上传视频</button>
                        <button class="refresh-btn" id="refreshBtn">↻ 刷新列表</button>
                    </div>
                </aside>
                <button class="upload-btn" id="uploadBtn" title="上传视频">＋</button>
            </section>
        </div>
    </div>

    <!-- Upload modal -->
    <div class="modal hidden" id="uploadModal">
        <div class="modal-card">
            <div class="modal-title">上传视频</div>
            <div class="modal-drop" id="dropZone">
                <div class="drop-icon">⬆️</div>
                <p>点击选择文件，或拖拽到此处</p>
                <p class="sub">支持 mp4 / webm / mov 等</p>
            </div>
            <input type="file" id="fileInput" accept="video/*" hidden>
            <div class="progress-area hidden" id="progressArea">
                <div class="progress-title" id="progressTitle"></div>
                <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
                <div class="progress-text" id="progressText">0%</div>
            </div>
            <div class="modal-actions">
                <button class="cancel-btn" id="cancelBtn">关闭</button>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
